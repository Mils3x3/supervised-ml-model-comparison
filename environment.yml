name: supervised-ml-model-comparison

channels:
  - conda-forge

dependencies:
  # Python
  - python=3.11

  # Jupyter
  - jupyterlab
  - notebook
  - ipykernel

  # Core data science
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scipy

  # Model training and tuning
  - xgboost
  - lightgbm
  - catboost=1.2.10
  - optuna
  - scikit-optimize

  # Utilities
  - joblib
  - threadpoolctl
  - psutil

  # Excel / table export support
  - openpyxl
  - dataframe_image
  - lxml

  # Optional visualization support
  - graphviz
  - python-graphviz