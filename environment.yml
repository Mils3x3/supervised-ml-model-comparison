name: supervised-ml-model-comparison

channels:
  - conda-forge

dependencies:
  # Python
  - python=3.11

  # Core data science libraries
  - numpy
  - pandas
  - scipy
  - packaging

  # Visualisation
  - matplotlib
  - seaborn

  # Machine learning
  - scikit-learn
  - xgboost
  - lightgbm
  - catboost

  # Model saving, loading and environment summary
  - joblib
  - psutil

  # Jupyter environment and HTML export
  - jupyter
  - notebook
  - ipykernel
  - nbconvert